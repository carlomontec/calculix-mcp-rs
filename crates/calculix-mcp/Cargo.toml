[package]
name = "calculix-mcp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Model Context Protocol server that lets AI agents inspect, mesh, solve and post-process CalculiX models"
readme = "README.md"

[[bin]]
name = "calculix-mcp"
path = "src/main.rs"

[dependencies]
cgx-core = { path = "../cgx-core" }
rmcp = { version = "3.10", features = ["server", "macros", "transport-io", "schemars"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "process", "time", "fs", "signal", "sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
clap = { workspace = true }
anyhow = { workspace = true }
rayon = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[lints]
workspace = true
